<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MoneyTrack admin dashboard">
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MoneyTrack Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#141A42">

  <title>MoneyTrack Admin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown while the dashboard downloads; removed in flutter_bootstrap.js. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F4F6FA; }
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #F4F6FA; color: #64748B;
      font: 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #splash img { width: 56px; height: 56px; border-radius: 14px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #E2E7EF; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #0B8457;
      animation: splash-load 1.1s ease-in-out infinite;
    }
    @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    #splash.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <div>Loading MoneyTrack Admin…</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
